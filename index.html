<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>زيتك – كتالوج موزع</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b6e4f">
<style>
body{font-family:system-ui;background:#f7f7f7;margin:0;padding:12px}
header{font-weight:700;font-size:20px;margin-bottom:10px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chip{padding:6px 12px;border-radius:20px;border:1px solid #ccc;cursor:pointer}
.chip.active{background:#0b6e4f;color:#fff;border-color:#0b6e4f}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.card{background:#fff;border-radius:12px;padding:10px;border:1px solid #ddd}
.price{font-weight:700;margin-top:6px}
</style>
</head>
<body>
<header>كتالوج زيتك – موزع فقط</header>
<div id="cats" class="chips"></div>
<div id="grid" class="grid"></div>

<script src="app.js"></script>
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js');
}
</script>
</body>
</html>
